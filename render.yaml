# render.yaml — Render deployment config for ChestAnnotate backend
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: chestannotate-api
    runtime: python
    region: singapore          # pick closest to your users
    plan: free                 # upgrade to starter ($7/mo) for always-on

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false            # set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MODEL_PATH
        value: ./models/chest_xray_seg.pth
      - key: ALLOWED_ORIGINS
        sync: false            # set to your Vercel URL e.g. https://chestannotate.vercel.app

    # Health check — Render will restart if this fails
    healthCheckPath: /health
